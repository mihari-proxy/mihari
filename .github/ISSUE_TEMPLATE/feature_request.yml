name: 功能请求
description: 提出一个新功能或改进建议
title: "[feat] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请先搜索 [已有 Issues](https://github.com/mihari-proxy/mihari/issues) 确认没有重复。
  - type: textarea
    id: problem
    attributes:
      label: 背景 / 要解决的问题
      description: 你遇到了什么场景或痛点？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能
      description: 描述你希望 mihari 如何解决这个问题
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 涉及入口
      options:
        - CLI
        - TUI
        - Web GUI 面板
        - daemon / 控制协议
        - 其他
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你尝试过的其他办法（可选）
