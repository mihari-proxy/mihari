name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Canonical stable version, e.g. v0.3.0 (leading zeroes are rejected)'
        required: true
        type: string
      commit_sha:
        description: 'Exact 40-hex main commit to release'
        required: true
        type: string

permissions:
  contents: read

env:
  # Single source of truth for the version: explicit input on dispatch, else the
  # pushed tag. workflow_dispatch on a branch would otherwise inject the branch
  # name via GITHUB_REF_NAME (design §4.2 — fixes the binary-version bug).
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  PLATFORMS: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64

jobs:
  resolve:
    name: resolve stable source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.source.outputs.should_release || steps.gate.outputs.should_release }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - id: gate
        name: Guard stable version
        run: |
          if [ "${GITHUB_EVENT_NAME}" = push ] && [[ "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dev\.(0|[1-9][0-9]*)$ ]]; then
            echo "should_resolve=false" >> "${GITHUB_OUTPUT}"
            echo "should_release=false" >> "${GITHUB_OUTPUT}"
            echo "dev tag is handled only by release-dev.yml"
            exit 0
          fi
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must match the required stable format"
            exit 1
          fi
          echo "should_resolve=true" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        if: steps.gate.outputs.should_resolve == 'true'
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0

      - id: source
        if: steps.gate.outputs.should_resolve == 'true'
        name: Resolve immutable source commit
        env:
          INPUT_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            printf '%s' "${INPUT_COMMIT_SHA}" | grep -Eq '^[0-9a-f]{40}$' \
              || { echo "::error::commit_sha must be a 40-character lowercase hexadecimal SHA"; exit 1; }
            SHA="$(git rev-parse HEAD)"
            [ "${SHA}" = "${INPUT_COMMIT_SHA}" ] \
              || { echo "::error::commit_sha does not match the checked-out main commit"; exit 1; }
          else
            SHA="$(git rev-parse "${GITHUB_REF}^{}")"
          fi
          [ "$(git rev-parse HEAD)" = "${SHA}" ] \
            || { echo "::error::checkout did not resolve ${SHA}"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "${SHA}" origin/main \
              || { echo "::error::stable tag must reference a commit reachable from main"; exit 1; }
          fi
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
          echo "should_release=true" >> "${GITHUB_OUTPUT}"

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: resolve
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: '' }
          - { goos: linux,   goarch: arm64, ext: '' }
          - { goos: darwin,  goarch: amd64, ext: '' }
          - { goos: darwin,  goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: windows, goarch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Verify immutable source commit
        run: |
          [ "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}" ] \
            || { echo "::error::checkout did not resolve the approved source commit"; exit 1; }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Version gate
        # Layer ② (design §4.2): reject pre-release suffixes / non-semver at every
        # entry point. The dispatch input is UI-gated upstream; this also covers
        # tag pushes and any API-direct triggering.
        run: |
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must match the required stable format"
            exit 1
          fi

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Asset names must be mihari-<goos>-<goarch>[.exe] WITHOUT the tag:
          # internal/update SelectSelfAsset and the install scripts rely on the
          # fixed prefix, and it keeps the /releases/latest/download/ URL stable.
          OUT="mihari-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath -ldflags "-s -w -X github.com/mihari-proxy/mihari/internal/buildinfo.Version=${VERSION}" -o "dist/${OUT}" ./cmd/mihari
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mihari-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  bundle:
    name: bundle all-in-one
    needs: [resolve, build]
    if: needs.resolve.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Verify immutable source commit
        run: |
          [ "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}" ] \
            || { echo "::error::checkout did not resolve the approved source commit"; exit 1; }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Build all-in-one bundles
        # One mihomo release fetch + shared GeoIP download, then 6 platform packs
        # (design §4.1). GITHUB_TOKEN raises the unauthenticated API rate ceiling.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run ./scripts/build-all-in-one \
            --mihari-dir dist --out bundles --platforms "${PLATFORMS}"
          ls -la bundles/

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: aio-bundles
          path: bundles/*

  release:
    name: publish release
    needs: [resolve, build, bundle]
    if: needs.resolve.outputs.should_release == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    concurrency:
      group: mihari-stable-alist
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # The URL alone enables AList publication. Missing username/password are
      # injected only below and make connect() fail closed instead of skipping.
      ALIST_CONFIGURED: ${{ secrets.ALIST_URL != '' }}
      MIHARI_KEEP_VERSIONS: ${{ vars.MIHARI_KEEP_VERSIONS }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Verify immutable source commit
        run: |
          [ "$(git rev-parse HEAD)" = "${SHA}" ] \
            || { echo "::error::checkout did not resolve the approved source commit"; exit 1; }

      - name: Version gate (final)
        # Layer ③ (design §4.2): last-chance gate before anything is published.
        run: |
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version rejected at final gate"
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          # GitHub release: every artifact. AList version dir: aio bundles only
          # (design §4.5 step 2).
          sha256sum * > SHA256SUMS.txt
          sha256sum mihari-all-in-one-* > AIO_SHA256SUMS.txt

      - name: Create or verify current stable tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verify_tag_ref() {
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" > /tmp/stable-tag-ref.json 2> /tmp/stable-tag-ref.err \
              || { echo "::error::unable to read current stable tag"; return 1; }
            jq -e '(.object.type | type == "string") and (.object.sha | type == "string")' /tmp/stable-tag-ref.json >/dev/null \
              || { echo "::error::current stable tag response is invalid"; return 1; }
            jq -c '{type: .object.type, sha: .object.sha}' /tmp/stable-tag-ref.json > /tmp/stable-tag-chain.jsonl
            tag_type="$(jq -r '.object.type' /tmp/stable-tag-ref.json)"
            tag_sha="$(jq -r '.object.sha' /tmp/stable-tag-ref.json)"
            for depth in $(seq 1 7); do
              [ "${tag_type}" = tag ] || break
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" > /tmp/stable-tag-object.json 2> /tmp/stable-tag-object.err \
                || { echo "::error::unable to peel current stable tag"; return 1; }
              jq -e '(.object.type | type == "string") and (.object.sha | type == "string")' /tmp/stable-tag-object.json >/dev/null \
                || { echo "::error::current annotated stable tag response is invalid"; return 1; }
              jq -c '{type: .object.type, sha: .object.sha}' /tmp/stable-tag-object.json >> /tmp/stable-tag-chain.jsonl
              tag_type="$(jq -r '.object.type' /tmp/stable-tag-object.json)"
              tag_sha="$(jq -r '.object.sha' /tmp/stable-tag-object.json)"
            done
            [ "${tag_type}" != tag ] || { echo "::error::stable tag peel exceeds the allowed depth"; return 1; }
            jq -s . /tmp/stable-tag-chain.jsonl > /tmp/stable-tag-chain.json
            python scripts/github_release_policy.py tag-chain \
              --chain /tmp/stable-tag-chain.json --expected-sha "${SHA}"
          }

          set +e
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" > /tmp/stable-tag-ref.json 2> /tmp/stable-tag-ref.err
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            grep -q 'HTTP 404' /tmp/stable-tag-ref.err \
              || { echo "::error::unable to determine current stable tag state"; exit 1; }
            if [ "${GITHUB_EVENT_NAME}" != workflow_dispatch ]; then
              echo "::error::tag-push release requires the pushed tag to still exist"
              exit 1
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/${VERSION}" -f "sha=${SHA}" > /tmp/stable-tag-create.json 2> /tmp/stable-tag-create.err \
              || { echo "::error::unable to create stable release tag"; exit 1; }
          fi
          verify_tag_ref

      - name: Publish GitHub release
        id: github_release
        uses: softprops/action-gh-release@v3
        with:
          # Explicit tag so workflow_dispatch (on a branch) tags/publishes the
          # requested version rather than the branch name (design §4.2).
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ env.SHA }}
          files: dist/*
          generate_release_notes: true

      - name: Verify current stable tag after publication
        if: "!cancelled() && (steps.github_release.outcome == 'success' || steps.github_release.outcome == 'failure')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" > /tmp/final-stable-tag-ref.json 2> /tmp/final-stable-tag-ref.err \
            || { echo "::error::unable to read stable tag after publication"; exit 1; }
          jq -e '(.object.type | type == "string") and (.object.sha | type == "string")' /tmp/final-stable-tag-ref.json >/dev/null \
            || { echo "::error::stable tag response after publication is invalid"; exit 1; }
          jq -c '{type: .object.type, sha: .object.sha}' /tmp/final-stable-tag-ref.json > /tmp/final-stable-tag-chain.jsonl
          tag_type="$(jq -r '.object.type' /tmp/final-stable-tag-ref.json)"
          tag_sha="$(jq -r '.object.sha' /tmp/final-stable-tag-ref.json)"
          for depth in $(seq 1 7); do
            [ "${tag_type}" = tag ] || break
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" > /tmp/final-stable-tag-object.json 2> /tmp/final-stable-tag-object.err \
              || { echo "::error::unable to peel stable tag after publication"; exit 1; }
            jq -e '(.object.type | type == "string") and (.object.sha | type == "string")' /tmp/final-stable-tag-object.json >/dev/null \
              || { echo "::error::annotated stable tag response after publication is invalid"; exit 1; }
            jq -c '{type: .object.type, sha: .object.sha}' /tmp/final-stable-tag-object.json >> /tmp/final-stable-tag-chain.jsonl
            tag_type="$(jq -r '.object.type' /tmp/final-stable-tag-object.json)"
            tag_sha="$(jq -r '.object.sha' /tmp/final-stable-tag-object.json)"
          done
          [ "${tag_type}" != tag ] || { echo "::error::stable tag peel after publication exceeds the allowed depth"; exit 1; }
          jq -s . /tmp/final-stable-tag-chain.jsonl > /tmp/final-stable-tag-chain.json
          python scripts/github_release_policy.py tag-chain \
            --chain /tmp/final-stable-tag-chain.json --expected-sha "${SHA}"

      - uses: actions/setup-python@v7
        if: env.ALIST_CONFIGURED == 'true'
        with:
          python-version: '3.12'

      - name: Publish to AList drive
        id: alist_mutation
        # design §4.5 steps 1-6. Conditional on ALIST_URL so GitHub-only releases
        # still succeed without the §9 prerequisites. End-to-end verified later.
        if: env.ALIST_CONFIGURED == 'true'
        env:
          ALIST_URL: ${{ secrets.ALIST_URL }}
          ALIST_USERNAME: ${{ secrets.ALIST_USERNAME }}
          ALIST_PASSWORD: ${{ secrets.ALIST_PASSWORD }}
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-release.txt
          python scripts/release-alist.py \
            --version "${VERSION}" \
            --dist-dir dist \
            --repo-root . \
            --channel stable \
            --commit-sha "${SHA}" \
            --base-path /mihari-release/mihari \
            --keep-versions "${MIHARI_KEEP_VERSIONS:-5}"

      - name: Upload stable index recovery backup
        if: "env.ALIST_CONFIGURED == 'true' && ((failure() && steps.alist_mutation.outcome == 'failure') || cancelled())"
        uses: actions/upload-artifact@v7
        with:
          name: stable-index-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihari-index-backup/stable/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Append offline install commands to release notes
        # design §4.5 step 7. The install commands are fixed public direct
        # links (signing is off on the AList drive), so they never change
        # between releases — append once per release; skip if the marker is
        # already present (idempotent re-runs).
        if: env.ALIST_CONFIGURED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(gh release view "${VERSION}" --json body -q .body)"
          MARKER='<!-- aio-install -->'
          if printf '%s' "$NOTES" | grep -qF "$MARKER"; then
            echo "offline install section already present — skipping"
            exit 0
          fi
          # Quoted heredoc delimiter: backticks and the irm scriptblock pass
          # through verbatim (no shell expansion). URLs are fixed public links.
          cat > /tmp/aio_append.md <<'TEMPLATE'

          <!-- aio-install -->
          ## 国内离线安装（AList 网盘，免 GitHub 访问）

          Linux / macOS：

          ```bash
          curl -fsSL https://cloud.xn--30q18ry71c.com/p/public/mihari-release/mihari/install-aio-remote.sh | bash
          ```

          Windows (PowerShell)：

          ```powershell
          & ([scriptblock]::Create((irm https://cloud.xn--30q18ry71c.com/p/public/mihari-release/mihari/install-aio-remote.ps1)))
          ```
          TEMPLATE
          gh release edit "${VERSION}" --notes "$(printf '%s\n%s\n' "$NOTES" "$(cat /tmp/aio_append.md)")"
