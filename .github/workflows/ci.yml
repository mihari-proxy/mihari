name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pin a v2 release: the v1 line is built with go1.24 and cannot load
          # configs targeting go1.26 (go.mod); action v6 does not support v2.
          version: v2.12.2

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Test AIO parallel downloader
        run: python scripts/install/test_parallel_download.py -v
      - name: Test
        run: go test -count=1 ./...

  # Fan-in for branch protection rules that still require a status named "test".
  test:
    runs-on: ubuntu-latest
    if: always()
    needs: [unit]
    steps:
      - name: Verify unit matrix
        run: |
          for result in ${{ join(needs.unit.result, ' ') }}; do
            [ "$result" = "success" ] || { echo "unit matrix result: $result"; exit 1; }
          done

  race:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Race
        run: go test -count=1 -race ./...

  vet-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format
        run: test -z "$(gofmt -l .)"

  # Observe-only coverage: reports total/critical packages; does not fail on percentage.
  # Relative regression gate (Task 4) requires ≥10 successful main observations first.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Coverage profile
        shell: bash
        run: |
          profile="$RUNNER_TEMP/mihari-coverage.out"
          go test -count=1 -covermode=atomic -coverpkg=./... -coverprofile="$profile" ./...
          go test -count=1 ./scripts/coverage-gate
          go run ./scripts/coverage-gate report -profile "$profile" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mihari-coverage-profile
          path: ${{ runner.temp }}/mihari-coverage.out
          retention-days: 14
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /tmp/mihari-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/mihari

  # Fan-in gate: branch protection requires a status named "cross-build", but
  # GitHub reports each matrix leg under its expanded name (build (linux,
  # amd64)), so no run ever reports the bare name and the check stays
  # "Expected - Waiting for status to be reported" forever. This job posts
  # the exact "cross-build" status and fails when any leg failed.
  cross-build:
    runs-on: ubuntu-latest
    if: always()
    needs: [build]
    steps:
      - name: Verify all matrix builds passed
        run: |
          for result in ${{ join(needs.build.result, ' ') }}; do
            [ "$result" = "success" ] || { echo "build matrix result: $result"; exit 1; }
          done
