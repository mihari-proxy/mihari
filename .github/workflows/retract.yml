name: retract

# Withdraw a fatally-broken release from every distribution channel (design §4.6).
# Manual dispatch only, with a boolean double-confirm. Idempotent: re-running on
# an already-retracted version removes nothing more and reports so.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Canonical stable version to retract, e.g. v0.3.0 (leading zeroes are rejected)'
        required: true
        type: string
      confirm:
        description: 'Confirm to permanently remove Release/assets and AList distribution; the canonical stable tag is retained.'
        required: true
        type: boolean

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}
  CONFIRM: ${{ inputs.confirm }}

jobs:
  resolve:
    name: resolve trusted stable source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - id: source
        name: Resolve trusted main commit
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"

  retract:
    name: retract stable release
    needs: resolve
    if: github.ref == 'refs/heads/main' && needs.resolve.outputs.sha != ''
    runs-on: ubuntu-latest
    concurrency:
      group: mihari-stable-alist
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      # The URL alone enables AList retraction. Missing username/password are
      # injected only below and make connect() fail closed instead of skipping.
      ALIST_CONFIGURED: ${{ secrets.ALIST_URL != '' }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Verify trusted source commit
        run: |
          [ "$(git rev-parse HEAD)" = "${SHA}" ] \
            || { echo "::error::checkout did not resolve the trusted main commit"; exit 1; }

      - name: Gate (semver + confirm)
        # design §4.6 step 1: pure-semver gate (same rule as §4.2) + the boolean
        # double-confirm must be true before anything destructive runs.
        run: |
          if [[ ! "${VERSION}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must match the required stable format"
            exit 1
          fi
          [ "${CONFIRM}" = "true" ] \
            || { echo "::error::confirm must be true to permanently remove Release/assets and AList distribution; canonical stable tag retained"; exit 1; }
          echo "Confirmed: permanently remove Release/assets and AList distribution for ${VERSION}; canonical stable tag retained."

      - uses: actions/setup-python@v7
        if: env.ALIST_CONFIGURED == 'true'
        with:
          python-version: '3.12'

      - name: Retract from AList drive
        id: alist_mutation
        # design §4.6 steps 2-4: read index, remove the version dir, rebuild
        # index.txt to point at the highest remaining complete version (or empty).
        # Conditional on ALIST_URL so retraction still works GitHub-only.
        if: env.ALIST_CONFIGURED == 'true'
        env:
          ALIST_URL: ${{ secrets.ALIST_URL }}
          ALIST_USERNAME: ${{ secrets.ALIST_USERNAME }}
          ALIST_PASSWORD: ${{ secrets.ALIST_PASSWORD }}
        run: |
          python -m pip install --disable-pip-version-check -r scripts/release/requirements.txt
          python scripts/release/retract-alist.py \
            --version "${VERSION}" \
            --channel stable \
            --base-path /mihari-release/mihari

      - name: Upload stable index recovery backup
        if: "env.ALIST_CONFIGURED == 'true' && ((failure() && steps.alist_mutation.outcome == 'failure') || (cancelled() && steps.alist_mutation.outcome == 'cancelled'))"
        uses: actions/upload-artifact@v7
        with:
          name: stable-index-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mihari-index-backup/stable/**
          if-no-files-found: ignore
          retention-days: 3

      - name: Delete GitHub release
        # design §4.6 step 5: delete the release and its assets, but retain the
        # protected canonical stable tag. A fix must use a higher version.
        # Idempotent: a missing release is reported, not fatal (re-run after a
        # partial retract).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_lookup_error="$(mktemp)"
          trap 'rm -f "${release_lookup_error}"' EXIT
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" \
            >/dev/null 2>"${release_lookup_error}"
          release_lookup_status=$?
          set -e

          if [ "${release_lookup_status}" -eq 0 ]; then
            gh release delete "${VERSION}" --yes
            echo "Permanently removed GitHub Release/assets for ${VERSION}; canonical stable tag retained."
          elif grep -Eq '(^|[^0-9])HTTP 404([^0-9]|$)' "${release_lookup_error}"; then
            echo "GitHub release ${VERSION} not found (already retracted?) — nothing to delete; canonical stable tag retained."
          else
            echo "::error::unable to determine whether the GitHub release exists"
            exit 1
          fi
